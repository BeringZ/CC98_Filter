<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CC98 Filter - 规则管理</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>CC98 Filter</h1>
      <label class="switch" title="总开关">
        <input type="checkbox" id="masterSwitch">
        <span class="slider"></span>
      </label>
    </header>

    <section class="add-form">
      <select id="addType">
        <option value="user">用户</option>
        <option value="keyword">关键词</option>
        <option value="board">版块</option>
      </select>
      <input type="text" id="addPattern" placeholder="规则内容（用户名 / 关键词 / 版块名）">
      <select id="addAction" title="屏蔽动作">
        <option value="hide">隐藏</option>
        <option value="collapse">折叠</option>
        <option value="blur">模糊</option>
        <option value="replace">替换</option>
      </select>
      <input type="text" id="addReplacement" placeholder="替换文案（仅替换模式）" style="display:none">
      <button id="addBtn" class="btn primary">+ 新建规则</button>
    </section>

    <section class="toolbar">
      <div class="tabs" id="typeTabs">
        <button class="tab active" data-type="all">全部</button>
        <button class="tab" data-type="user">用户</button>
        <button class="tab" data-type="keyword">关键词</button>
        <button class="tab" data-type="board">版块</button>
      </div>
      <input type="search" id="searchInput" placeholder="🔍 搜索规则">
    </section>

    <section class="rule-table-wrap">
      <table class="rule-table">
        <thead>
          <tr>
            <th>规则</th>
            <th>类型</th>
            <th>动作</th>
            <th>状态</th>
            <th>更新时间</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="ruleTableBody"></tbody>
      </table>
      <div class="empty" id="emptyHint">没有匹配的规则</div>
    </section>

    <section class="data-section">
      <h2>数据管理</h2>
      <div class="btn-row">
        <button id="exportBtn" class="btn">导出备份</button>
        <button id="importBtn" class="btn">导入备份</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
        <button id="clearBtn" class="btn danger">清空全部规则</button>
      </div>
      <p class="hint">导入时可选「合并」（保留现有规则）或「覆盖」（替换全部）。支持 v1 旧版备份文件，自动迁移为统一规则。</p>
    </section>
  </div>

  <script src="../shared/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
