<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <span class="logo">CC98 Filter</span>
    <label class="switch" title="总开关">
      <input type="checkbox" id="masterSwitch">
      <span class="slider"></span>
    </label>
  </header>

  <div class="stats" id="pageStats">本页统计加载中…</div>

  <section class="quick-add">
    <select id="addType">
      <option value="user">用户</option>
      <option value="keyword">关键词</option>
      <option value="board">版块</option>
    </select>
    <input type="text" id="addInput" placeholder="输入后回车添加">
  </section>

  <section class="recent">
    <div class="section-title">最近规则</div>
    <div id="recentList"></div>
  </section>

  <footer>
    <button id="manageBtn" class="manage-btn">管理全部规则 →</button>
  </footer>

  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
